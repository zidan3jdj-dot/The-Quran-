<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مصحف النور - العرض الاحترافي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root { --gold: #c9a959; --dark-blue: #0d2b35; --paper: #fdfbf1; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Cairo', sans-serif; background: #0a0f1e; color: #fff; }
        
        .app-wrapper { max-width: 480px; margin: 0 auto; background: #07131c; min-height: 100vh; position: relative; }
        .app-content { padding: 15px 15px 100px; }

        /* الهيدر */
        .main-header { background: linear-gradient(135deg, #1a4755, #0d2b35); border-radius: 0 0 25px 25px; padding: 20px; border-bottom: 2px solid var(--gold); text-align: center; margin-bottom: 20px; }
        .logo-text { font-size: 24px; font-weight: 900; color: var(--gold); }

        /* الكروت والقوائم */
        .card { background: linear-gradient(145deg, #1a4755, #0f2b3d); border: 1px solid rgba(201,169,89,0.3); border-radius: 15px; padding: 15px; margin-bottom: 10px; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: 0.2s; }
        .card:active { transform: scale(0.98); }
        .num-badge { background: var(--gold); color: #000; width: 35px; height: 35px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: bold; }

        /* شبكة الأجزاء */
        .juz-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; animation: fadeIn 0.4s; }
        .juz-box { background: #1a4755; border: 1px solid var(--gold); border-radius: 12px; padding: 15px 5px; text-align: center; cursor: pointer; }
        .juz-box span { display: block; color: var(--gold); font-weight: 900; font-size: 20px; }

        /* صفحة القراءة - محاكاة المصحف الورقي */
        .reader-screen { position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; height: 100vh; background: var(--paper); z-index: 1000; display: none; flex-direction: column; }
        .reader-header { background: var(--dark-blue); color: var(--gold); padding: 15px; display: flex; align-items: center; justify-content: space-between; }
        
        .quran-container { flex: 1; overflow-y: auto; padding: 15px; background: var(--paper); position: relative; }
        .mushaf-page { 
            background: #fffef7; 
            border: 2px solid #e2d7b5;
            padding: 40px 20px;
            min-height: 100%;
            position: relative;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.05);
            text-align: center;
        }
        /* زخرفة رأس السورة */
        .surah-header-frame {
            border: 2px solid #8b6f3c;
            margin-bottom: 30px;
            padding: 10px;
            background-image: url('https://www.transparenttextures.com/patterns/arabesque.png');
            color: #2c2c2c;
            font-family: 'Amiri', serif;
            font-weight: bold;
            font-size: 24px;
        }

        .ayah-text { font-family: 'Amiri', serif; font-size: 26px; line-height: 2.2; color: #1a1a1a; word-spacing: 2px; }
        .ayah-end { color: #8b6f3c; font-family: 'Cairo'; font-size: 16px; margin: 0 4px; font-weight: bold; }
        .active-ayah { background: rgba(201,169,89,0.2); border-radius: 5px; }

        /* شريط التحكم السفلي في القراءة */
        .reader-controls { background: var(--dark-blue); padding: 15px; border-top: 2px solid var(--gold); }
        .player-info { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .p-avatar { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--gold); }
        
        /* شريط التنقل الرئيسي */
        .nav-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #0f2b3d; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid var(--gold); }
        .nav-item { color: #7f8c8d; text-align: center; font-size: 12px; cursor: pointer; }
        .nav-item.active { color: var(--gold); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="app-wrapper">
    <div class="app-content">
        <div class="main-header">
            <div class="logo-text">القرآن الكريم</div>
            <div id="dateNow" style="font-size: 12px; color: #a0b9c4; margin-top: 5px;"></div>
        </div>

        <div id="surahsTab" class="tab-pane">
            <div id="surahList"></div>
        </div>

        <div id="juzTab" class="tab-pane" style="display:none;">
            <div id="juzContainer">
                <div class="juz-grid" id="juzGrid"></div>
            </div>
        </div>

        <div id="recitersTab" class="tab-pane" style="display:none;">
            <div id="reciterList"></div>
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active" onclick="switchTab('surahs', this)"><i class="fas fa-book-open"></i><div>السور</div></div>
        <div class="nav-item" onclick="switchTab('juz', this)"><i class="fas fa-th"></i><div>الأجزاء</div></div>
        <div class="nav-item" onclick="switchTab('reciters', this)"><i class="fas fa-microphone"></i><div>القراء</div></div>
    </div>
</div>

<div id="readerScreen" class="reader-screen">
    <div class="reader-header">
        <i class="fas fa-times" onclick="closeReader()" style="font-size: 20px; cursor: pointer;"></i>
        <div id="readerTitle" style="font-weight: bold; font-size: 18px;"></div>
        <i class="fas fa-share-alt"></i>
    </div>
    
    <div class="quran-container">
        <div class="mushaf-page">
            <div class="surah-header-frame" id="surahFrameTitle"></div>
            <div id="quranText" class="ayah-text"></div>
        </div>
    </div>

    <div class="reader-controls">
        <div class="player-info">
            <img src="" id="currentPImg" class="p-avatar">
            <div style="flex:1">
                <div id="currentPName" style="font-size: 13px; font-weight: bold; color: var(--gold);"></div>
                <div id="currentAyahInfo" style="font-size: 11px; color: #a0b9c4;">جاهز للتشغيل</div>
            </div>
            <button onclick="togglePlay()" style="background:var(--gold); border:none; width:40px; height:40px; border-radius:50%;">
                <i id="playIcon" class="fas fa-play" style="color:#000;"></i>
            </button>
        </div>
    </div>
</div>

<script>
    const API = "https://api.alquran.cloud/v1";
    let allSurahs = [];
    let currentAyahs = [];
    let currentIdx = 0;
    let audio = new Audio();
    let selectedReciter = { id: 'ar.alafasy', name: 'مشاري العفاسي', img: 'https://static.surah.com/images/reciters/10/mishary-rashid-alafasy-medium.jpg' };

    async function init() {
        document.getElementById('dateNow').innerText = new Date().toLocaleDateString('ar-SA', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        await loadSurahs();
        renderJuzGrid();
        renderReciters();
    }

    async function loadSurahs() {
        const res = await fetch(`${API}/surah`);
        const data = await res.json();
        allSurahs = data.data;
        displaySurahs(allSurahs, 'surahList');
    }

    function displaySurahs(list, containerId) {
        document.getElementById(containerId).innerHTML = list.map(s => `
            <div class="card" onclick="openSurah(${s.number}, '${s.name}')">
                <div class="num-badge">${s.number}</div>
                <div style="flex:1">
                    <div style="font-weight:700; font-size:18px;">${s.name}</div>
                    <div style="font-size:12px; color:#a0b9c4;">${s.numberOfAyahs} آية | ${s.revelationType === 'Meccan' ? 'مكية' : 'مدنية'}</div>
                </div>
                <i class="fas fa-chevron-left" style="color:var(--gold)"></i>
            </div>
        `).join('');
    }

    function renderJuzGrid() {
        const grid = document.getElementById('juzGrid');
        grid.innerHTML = '';
        for(let i=1; i<=30; i++) {
            grid.innerHTML += `<div class="juz-box" onclick="showJuzDetails(${i})"><span>${i}</span><div style="font-size:11px;">الجزء</div></div>`;
        }
    }

    async function showJuzDetails(juzNum) {
        const res = await fetch(`${API}/juz/${juzNum}/quran-uthmani`);
        const data = await res.json();
        const surahIds = [...new Set(data.data.ayahs.map(a => a.surah.number))];
        const filtered = allSurahs.filter(s => surahIds.includes(s.number));

        document.getElementById('juzContainer').innerHTML = `
            <div onclick="resetJuzView()" style="color:var(--gold); margin-bottom:15px; cursor:pointer;"><i class="fas fa-arrow-right"></i> عودة للأجزاء</div>
            <h3 style="margin-bottom:15px; color:var(--gold);">سور الجزء ${juzNum}</h3>
            <div id="juzSurahList"></div>
        `;
        displaySurahs(filtered, 'juzSurahList');
    }

    function resetJuzView() {
        document.getElementById('juzContainer').innerHTML = `<div class="juz-grid" id="juzGrid"></div>`;
        renderJuzGrid();
    }

    async function openSurah(num, name) {
        document.getElementById('readerScreen').style.display = 'flex';
        document.getElementById('readerTitle').innerText = name;
        document.getElementById('surahFrameTitle').innerText = "سورة " + name;
        document.getElementById('quranText').innerHTML = "جاري التحميل...";
        
        const res = await fetch(`${API}/surah/${num}/quran-uthmani`);
        const data = await res.json();
        currentAyahs = data.data.ayahs;
        
        document.getElementById('quranText').innerHTML = currentAyahs.map((a, i) => `
            <span id="ayah-${i}" onclick="playAyah(${i})" style="cursor:pointer;">
                ${a.text} <span class="ayah-end">﴿${a.numberInSurah}﴾</span>
            </span>
        `).join(' ');

        document.getElementById('currentPName').innerText = selectedReciter.name;
        document.getElementById('currentPImg').src = selectedReciter.img;
    }

    function playAyah(index) {
        currentIdx = index;
        const ayah = currentAyahs[index];
        
        document.querySelectorAll('span[id^="ayah-"]').forEach(el => el.classList.remove('active-ayah'));
        const activeEl = document.getElementById(`ayah-${index}`);
        activeEl.classList.add('active-ayah');
        activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });

        audio.src = `https://cdn.islamic.network/quran/audio/128/${selectedReciter.id}/${ayah.number}.mp3`;
        audio.play();
        document.getElementById('playIcon').className = 'fas fa-pause';
        document.getElementById('currentAyahInfo').innerText = `الآية رقم ${ayah.numberInSurah}`;
    }

    audio.onended = () => { if(currentIdx < currentAyahs.length -1) playAyah(currentIdx + 1); };

    function togglePlay() {
        if(audio.paused) { audio.play(); document.getElementById('playIcon').className = 'fas fa-pause'; }
        else { audio.pause(); document.getElementById('playIcon').className = 'fas fa-play'; }
    }

    function switchTab(tab, el) {
        document.querySelectorAll('.tab-pane').forEach(p => p.style.display = 'none');
        document.getElementById(tab + 'Tab').style.display = 'block';
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
    }

    function renderReciters() {
        const reciters = [
            { id: 'ar.alafasy', name: 'مشاري العفاسي', img: '3.jpeg' },
            { id: 'ar.minshawi', name: 'المنشاوي', img: '1.jpeg' }
        ];
        document.getElementById('reciterList').innerHTML = reciters.map(r => `
            <div class="card" onclick="selectReciter('${r.id}', '${r.name}', '${r.img}')">
                <img src="${r.img}" style="width:50px; height:50px; border-radius:50%; border:1px solid var(--gold);">
                <div style="font-weight:bold;">${r.name}</div>
            </div>
        `).join('');
    }

    function selectReciter(id, name, img) {
        selectedReciter = { id, name, img };
        alert("تم اختيار القارئ: " + name);
    }

    function closeReader() {
        audio.pause();
        document.getElementById('readerScreen').style.display = 'none';
    }

    init();
</script>
</body>
</html>
