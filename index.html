<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>القرآن الكريم - تلاوات خاشعة</title>
    <!-- الخطوط -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <!-- أيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(145deg, #0a3328 0%, #1a5e45 100%);
            min-height: 100vh;
            color: #f5e6d3;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px 15px 90px;
        }

        /* ===== الهيدر ===== */
        .header {
            background: rgba(10, 51, 40, 0.9);
            backdrop-filter: blur(10px);
            border: 2px solid #d4af37;
            border-radius: 50px;
            padding: 12px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #d4af37;
            color: #0a3328;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 18px;
        }

        @media (max-width: 480px) {
            .logo span {
                display: none;
            }
        }

        .date-badge {
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid #d4af37;
            padding: 5px 15px;
            border-radius: 40px;
            font-size: 14px;
        }

        /* ===== أزرار التبويب ===== */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            background: rgba(10, 51, 40, 0.7);
            border: 2px solid #d4af37;
            color: #e6d5a8;
            padding: 12px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab i {
            color: #d4af37;
        }

        .tab.active {
            background: #d4af37;
            color: #0a3328;
        }

        .tab.active i {
            color: #0a3328;
        }

        /* ===== البحث ===== */
        .search-box {
            background: rgba(10, 51, 40, 0.7);
            border: 2px solid #d4af37;
            border-radius: 50px;
            padding: 5px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }

        .search-box i {
            color: #d4af37;
            font-size: 20px;
            margin-left: 10px;
        }

        .search-box input {
            background: transparent;
            border: none;
            width: 100%;
            padding: 12px 0;
            color: #f5e6d3;
            font-size: 16px;
            outline: none;
        }

        .search-box input::placeholder {
            color: #a8b8a0;
        }

        /* ===== قائمة السور ===== */
        .surah-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        @media (max-width: 600px) {
            .surah-grid {
                grid-template-columns: 1fr;
            }
        }

        .surah-card {
            background: rgba(10, 51, 40, 0.7);
            backdrop-filter: blur(5px);
            border: 2px solid #d4af37;
            border-radius: 30px;
            padding: 20px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .surah-card:hover {
            background: rgba(212, 175, 55, 0.2);
            transform: translateY(-3px);
        }

        .surah-number {
            background: #d4af37;
            color: #0a3328;
            width: 50px;
            height: 50px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
            border: 2px solid #e6d5a8;
        }

        .surah-info {
            flex: 1;
        }

        .surah-name {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .surah-meta {
            display: flex;
            gap: 10px;
            color: #d4af37;
            font-size: 14px;
        }

        /* ===== قائمة الأجزاء ===== */
        .juz-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
        }

        .juz-card {
            background: rgba(10, 51, 40, 0.7);
            border: 2px solid #d4af37;
            border-radius: 25px;
            padding: 20px 5px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .juz-card:hover {
            background: #d4af37;
            color: #0a3328;
            transform: translateY(-3px);
        }

        .juz-number {
            font-size: 32px;
            font-weight: 800;
            color: #d4af37;
        }

        .juz-card:hover .juz-number {
            color: #0a3328;
        }

        /* ===== صفحة التلاوة ===== */
        .reader-page {
            display: none;
        }

        .reader-header {
            background: rgba(10, 51, 40, 0.9);
            border: 2px solid #d4af37;
            border-radius: 40px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: #1a5e45;
            border: 1px solid #d4af37;
            color: #f5e6d3;
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
        }

        .surah-title {
            background: rgba(212, 175, 55, 0.15);
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 20px;
            font-weight: 700;
            color: #d4af37;
            margin-right: auto;
        }

        /* ===== القراء ===== */
        .reciters-section {
            margin-top: 15px;
        }

        .reciters-label {
            color: #d4af37;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .reciters-scroll {
            overflow-x: auto;
            padding: 5px 0 15px;
            -webkit-overflow-scrolling: touch;
        }

        .reciters-list {
            display: flex;
            gap: 12px;
            width: max-content;
        }

        .reciter-item {
            background: rgba(10, 51, 40, 0.7);
            border: 2px solid #d4af37;
            border-radius: 50px;
            padding: 8px 20px;
            cursor: pointer;
            transition: 0.3s;
            min-width: 120px;
            text-align: center;
        }

        .reciter-item.active {
            background: #d4af37;
            color: #0a3328;
        }

        /* ===== المصحف ===== */
        .mushaf {
            background: #faf3e0;
            border-radius: 40px 40px 20px 20px;
            padding: 25px 20px;
            box-shadow: 0 0 0 4px #1a5e45, 0 0 0 8px #d4af37;
            color: #1e3a2b;
            line-height: 2.4;
            font-size: 24px;
            font-family: 'Amiri', serif;
            margin: 20px 0;
        }

        @media (max-width: 480px) {
            .mushaf {
                font-size: 20px;
                padding: 15px;
            }
        }

        .bismillah {
            font-size: 28px;
            color: #1a5e45;
            text-align: center;
            border-bottom: 2px dashed #d4af37;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .ayah-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #d4af37;
            color: #0a3328;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-size: 12px;
            margin: 0 5px 0 10px;
            border: 2px solid #1a5e45;
        }

        .copy-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: 1px solid #d4af37;
            color: #1a5e45;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-size: 11px;
            margin: 0 3px;
            cursor: pointer;
            transition: 0.3s;
        }

        .copy-btn:hover {
            background: #d4af37;
            color: #0a3328;
        }

        /* ===== المشغل ===== */
        .player {
            position: fixed;
            bottom: 15px;
            left: 10px;
            right: 10px;
            background: rgba(10, 51, 40, 0.98);
            border: 2px solid #d4af37;
            border-radius: 60px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 2000;
        }

        .player.hidden {
            display: none;
        }

        @media (max-width: 600px) {
            .player {
                flex-wrap: wrap;
                border-radius: 40px;
            }
        }

        .player-controls {
            display: flex;
            gap: 10px;
        }

        .player-btn {
            background: linear-gradient(145deg, #d4af37, #1a5e45);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            color: #0a3328;
            font-size: 20px;
            cursor: pointer;
        }

        .player-info {
            flex: 1;
            min-width: 200px;
        }

        .progress-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .progress-bar {
            flex: 1;
            height: 5px;
            background: #1a5e45;
            border-radius: 5px;
            cursor: pointer;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #d4af37;
            border-radius: 5px;
        }

        .time {
            color: #d4af37;
            font-size: 13px;
            min-width: 80px;
        }

        /* ===== إشعارات ===== */
        .notification {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: #d4af37;
            color: #0a3328;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 600;
            display: none;
            z-index: 5000;
        }

        /* ===== تحميل ===== */
        .loader {
            text-align: center;
            padding: 40px;
            color: #d4af37;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- الهيدر -->
        <div class="header">
            <div class="logo">
                <i class="fas fa-quran"></i>
                <span>القرآن الكريم</span>
            </div>
            <div class="date-badge" id="dateDisplay"></div>
        </div>

        <!-- الصفحة الرئيسية -->
        <div id="homePage">
            <!-- أزرار التبويب -->
            <div class="tabs">
                <button class="tab active" onclick="switchTab('surahs')">
                    <i class="fas fa-list"></i> السور
                </button>
                <button class="tab" onclick="switchTab('juz')">
                    <i class="fas fa-layer-group"></i> الأجزاء
                </button>
            </div>

            <!-- البحث -->
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="ابحث عن سورة...">
            </div>

            <!-- السور -->
            <div id="surahsTab">
                <div class="surah-grid" id="surahList"></div>
            </div>

            <!-- الأجزاء -->
            <div id="juzTab" style="display: none;">
                <div class="juz-grid" id="juzList"></div>
            </div>
        </div>

        <!-- صفحة الأجزاء -->
        <div id="juzPage" style="display: none;">
            <div class="reader-header" style="margin-bottom: 20px;">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <button class="nav-btn" onclick="backToHome()">
                        <i class="fas fa-arrow-right"></i> العودة
                    </button>
                    <div class="surah-title" id="juzTitle"></div>
                </div>
            </div>
            <div class="surah-grid" id="juzSurahsList"></div>
        </div>

        <!-- صفحة التلاوة -->
        <div id="readerPage" style="display: none;">
            <div class="reader-header">
                <div class="nav-buttons">
                    <button class="nav-btn" onclick="backToHome()">
                        <i class="fas fa-home"></i> الرئيسية
                    </button>
                    <div class="surah-title" id="surahName"></div>
                    <button class="nav-btn" onclick="shareSurah()">
                        <i class="fas fa-share-alt"></i>
                    </button>
                </div>

                <!-- القراء -->
                <div class="reciters-section">
                    <div class="reciters-label">
                        <i class="fas fa-microphone-alt"></i>
                        <span>اختر القارئ</span>
                    </div>
                    <div class="reciters-scroll">
                        <div class="reciters-list" id="recitersList"></div>
                    </div>
                </div>
            </div>

            <!-- معلومات السورة -->
            <div style="background: rgba(10,51,40,0.5); border-radius: 30px; padding: 15px; margin-bottom: 15px; text-align: center;">
                <div style="color: #d4af37; font-size: 24px;" id="surahNameLarge"></div>
                <div style="display: flex; gap: 15px; justify-content: center; margin-top: 5px;" id="surahInfo"></div>
            </div>

            <!-- الآيات -->
            <div class="mushaf" id="ayahsContainer"></div>
        </div>
    </div>

    <!-- المشغل -->
    <div class="player hidden" id="player">
        <div class="player-controls">
            <button class="player-btn" onclick="prevSurah()" id="prevBtn"><i class="fas fa-step-backward"></i></button>
            <button class="player-btn" onclick="togglePlay()" id="playBtn"><i class="fas fa-play"></i></button>
            <button class="player-btn" onclick="nextSurah()" id="nextBtn"><i class="fas fa-step-forward"></i></button>
        </div>
        <div class="player-info">
            <div style="display: flex; justify-content: space-between; color: #d4af37; margin-bottom: 5px;">
                <span id="nowPlaying"></span>
                <span id="currentReciter"></span>
            </div>
            <div class="progress-area">
                <div class="progress-bar" id="progressBar" onclick="seekTo(event)">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <span class="time" id="timeDisplay">00:00 / 00:00</span>
            </div>
        </div>
        <audio id="audio"></audio>
    </div>

    <!-- إشعارات -->
    <div class="notification" id="notification"></div>

    <script>
        // ========== API ==========
        const API_QURAN = "https://api.alquran.cloud/v1";
        const API_MP3 = "https://mp3quran.net/api/v3";

        // ========== القراء ==========
        const reciters = [
            { id: 4, name: 'محمد المنشاوي', img: '3.jpeg' },
            { id: 1, name: 'عبد الباسط عبد الصمد', img: '2.jpeg' },
            { id: 6, name: 'مشاري العفاسي', img: '1.jpeg' },
            { id: 235, name: 'ياسر الدوسري', img: '4.jpeg' }
        ];

        // ========== المتغيرات ==========
        let allSurahs = [];
        let currentSurah = null;
        let currentReciter = reciters[0];
        let currentSurahNumber = 1;
        let ayahs = [];
        let isPlaying = false;
        let recitersData = [];

        // عناصر DOM
        const homePage = document.getElementById('homePage');
        const juzPage = document.getElementById('juzPage');
        const readerPage = document.getElementById('readerPage');
        const surahList = document.getElementById('surahList');
        const juzList = document.getElementById('juzList');
        const juzSurahsList = document.getElementById('juzSurahsList');
        const ayahsContainer = document.getElementById('ayahsContainer');
        const audio = document.getElementById('audio');
        const player = document.getElementById('player');
        const playBtn = document.getElementById('playBtn');
        const progressFill = document.getElementById('progressFill');
        const timeDisplay = document.getElementById('timeDisplay');
        const progressBar = document.getElementById('progressBar');
        const notification = document.getElementById('notification');
        const recitersList = document.getElementById('recitersList');
        const nowPlaying = document.getElementById('nowPlaying');
        const currentReciterSpan = document.getElementById('currentReciter');

        // ========== تحميل بيانات القراء من API ==========
        async function loadRecitersFromAPI() {
            try {
                const res = await fetch(`${API_MP3}/reciters?language=ar`);
                const data = await res.json();
                
                // فلترة القراء المطلوبين
                const filteredReciters = data.reciters.filter(r => 
                    [4, 1, 6, 235].includes(r.id)
                );
                
                if (filteredReciters.length > 0) {
                    recitersData = filteredReciters;
                    currentReciter = recitersData[0];
                    displayReciters();
                }
            } catch (e) {
                console.log('خطأ في تحميل القراء، استخدام البيانات الافتراضية');
                // استخدام البيانات الافتراضية
                recitersData = reciters.map(r => ({ id: r.id, name: r.name }));
                currentReciter = recitersData[0];
                displayReciters();
            }
        }

        // ========== عرض القراء ==========
        function displayReciters() {
            recitersList.innerHTML = '';
            recitersData.forEach(reciter => {
                const div = document.createElement('div');
                div.className = `reciter-item ${reciter.id === currentReciter.id ? 'active' : ''}`;
                div.textContent = reciter.name;
                div.onclick = () => selectReciter(reciter);
                recitersList.appendChild(div);
            });
        }

        function selectReciter(reciter) {
            currentReciter = reciter;
            document.querySelectorAll('.reciter-item').forEach(item => {
                item.classList.remove('active');
                if (item.textContent === reciter.name) {
                    item.classList.add('active');
                }
            });
            
            if (currentSurahNumber) {
                loadSurahAudio(currentSurahNumber);
            }
            showNotification(`تم اختيار ${reciter.name}`);
        }

        // ========== تحميل السور ==========
        async function loadSurahs() {
            try {
                const res = await fetch(`${API_QURAN}/surah`);
                const data = await res.json();
                allSurahs = data.data;
                displaySurahs(allSurahs);
            } catch (e) {
                surahList.innerHTML = '<div class="loader">خطأ في التحميل</div>';
            }
        }

        function displaySurahs(surahs) {
            surahList.innerHTML = '';
            surahs.forEach(s => {
                const card = document.createElement('div');
                card.className = 'surah-card';
                card.innerHTML = `
                    <div class="surah-number">${s.number}</div>
                    <div class="surah-info">
                        <div class="surah-name">${s.name}</div>
                        <div class="surah-meta">
                            <span>${s.revelationType === 'Meccan' ? 'مكية' : 'مدنية'}</span>
                            <span>${s.numberOfAyahs} آيات</span>
                        </div>
                    </div>
                `;
                card.onclick = () => openSurah(s);
                surahList.appendChild(card);
            });
        }

        // ========== تحميل الأجزاء ==========
        function loadJuzList() {
            juzList.innerHTML = '';
            for (let i = 1; i <= 30; i++) {
                const card = document.createElement('div');
                card.className = 'juz-card';
                card.innerHTML = `
                    <div class="juz-number">${i}</div>
                    <div>الجزء ${i}</div>
                `;
                card.onclick = () => openJuz(i);
                juzList.appendChild(card);
            }
        }

        // ========== فتح الجزء ==========
        async function openJuz(juzNumber) {
            try {
                homePage.style.display = 'none';
                juzPage.style.display = 'block';
                document.getElementById('juzTitle').textContent = `الجزء ${juzNumber}`;
                juzSurahsList.innerHTML = '<div class="loader">جاري التحميل...</div>';

                const res = await fetch(`${API_QURAN}/juz/${juzNumber}/quran-uthmani`);
                const data = await res.json();
                
                const surahsInJuz = [];
                const seen = new Set();
                
                data.data.ayahs.forEach(ayah => {
                    if (!seen.has(ayah.surah.number)) {
                        seen.add(ayah.surah.number);
                        surahsInJuz.push({
                            number: ayah.surah.number,
                            name: ayah.surah.name,
                            type: ayah.surah.revelationType,
                            ayahs: ayah.surah.numberOfAyahs
                        });
                    }
                });

                juzSurahsList.innerHTML = '';
                surahsInJuz.forEach(s => {
                    const card = document.createElement('div');
                    card.className = 'surah-card';
                    card.innerHTML = `
                        <div class="surah-number">${s.number}</div>
                        <div class="surah-info">
                            <div class="surah-name">${s.name}</div>
                            <div class="surah-meta">
                                <span>${s.type === 'Meccan' ? 'مكية' : 'مدنية'}</span>
                                <span>${s.ayahs} آيات</span>
                            </div>
                        </div>
                    `;
                    card.onclick = () => openSurah(s);
                    juzSurahsList.appendChild(card);
                });
            } catch (e) {
                juzSurahsList.innerHTML = '<div class="loader">خطأ في التحميل</div>';
            }
        }

        // ========== فتح السورة ==========
        async function openSurah(surah) {
            try {
                homePage.style.display = 'none';
                juzPage.style.display = 'none';
                readerPage.style.display = 'block';
                
                currentSurah = surah;
                currentSurahNumber = surah.number;
                
                document.getElementById('surahName').textContent = `سورة ${surah.name}`;
                document.getElementById('surahNameLarge').textContent = `سورة ${surah.name}`;
                document.getElementById('surahInfo').innerHTML = `
                    <span><i class="fas fa-book-open"></i> ${surah.numberOfAyahs} آيات</span>
                    <span><i class="fas fa-city"></i> ${surah.revelationType === 'Meccan' ? 'مكية' : 'مدنية'}</span>
                `;
                
                nowPlaying.textContent = `سورة ${surah.name}`;
                currentReciterSpan.textContent = currentReciter.name;
                
                player.classList.remove('hidden');
                
                await loadSurahAyahs(surah.number);
                await loadSurahAudio(surah.number);
                
                window.scrollTo(0, 0);
            } catch (e) {
                showNotification('خطأ في تحميل السورة');
            }
        }

        // ========== تحميل الآيات ==========
        async function loadSurahAyahs(surahNumber) {
            try {
                ayahsContainer.innerHTML = '<div class="loader">جاري تحميل الآيات...</div>';
                
                const res = await fetch(`${API_QURAN}/surah/${surahNumber}/quran-uthmani`);
                const data = await res.json();
                ayahs = data.data.ayahs;
                
                displayAyahs();
            } catch (e) {
                ayahsContainer.innerHTML = '<div class="loader">خطأ في التحميل</div>';
            }
        }

        function displayAyahs() {
            ayahsContainer.innerHTML = '';
            
            if (currentSurahNumber !== 9) {
                const b = document.createElement('div');
                b.className = 'bismillah';
                b.textContent = 'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ';
                ayahsContainer.appendChild(b);
            }
            
            ayahs.forEach((a, i) => {
                const span = document.createElement('span');
                
                const text = document.createElement('span');
                text.textContent = a.text;
                
                const number = document.createElement('span');
                number.className = 'ayah-number';
                number.textContent = a.numberInSurah;
                
                const copy = document.createElement('span');
                copy.className = 'copy-btn';
                copy.innerHTML = '<i class="fas fa-copy"></i>';
                copy.onclick = (e) => {
                    e.stopPropagation();
                    copyAyah(a.text);
                };
                
                span.appendChild(text);
                span.appendChild(number);
                span.appendChild(copy);
                ayahsContainer.appendChild(span);
            });
        }

        // ========== تحميل الصوت ==========
        async function loadSurahAudio(surahNumber) {
            try {
                // البحث عن القارئ في API
                const res = await fetch(`${API_MP3}/reciters?reciter=${currentReciter.id}&language=ar`);
                const data = await res.json();
                
                if (data.reciters && data.reciters[0] && data.reciters[0].moshaf) {
                    const moshaf = data.reciters[0].moshaf[0];
                    const surahNumStr = surahNumber.toString().padStart(3, '0');
                    const audioUrl = `${moshaf.server}${surahNumStr}.mp3`;
                    
                    audio.src = audioUrl;
                    audio.load();
                    
                    updateNavButtons();
                }
            } catch (e) {
                console.log('خطأ في تحميل الصوت:', e);
                showNotification('فشل تحميل الصوت');
            }
        }

        // ========== مشغل الصوت ==========
        function togglePlay() {
            if (audio.paused) {
                audio.play().catch(() => {
                    showNotification('تعذر التشغيل');
                });
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                isPlaying = true;
            } else {
                audio.pause();
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
                isPlaying = false;
            }
        }

        function prevSurah() {
            if (currentSurahNumber > 1) {
                const prevSurah = allSurahs[currentSurahNumber - 2];
                openSurah(prevSurah);
            }
        }

        function nextSurah() {
            if (currentSurahNumber < 114) {
                const nextSurah = allSurahs[currentSurahNumber];
                openSurah(nextSurah);
            }
        }

        function updateNavButtons() {
            document.getElementById('prevBtn').disabled = currentSurahNumber <= 1;
            document.getElementById('nextBtn').disabled = currentSurahNumber >= 114;
        }

        // ========== تحديث الوقت ==========
        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        audio.addEventListener('loadedmetadata', () => {
            timeDisplay.textContent = `00:00 / ${formatTime(audio.duration)}`;
        });

        audio.addEventListener('timeupdate', () => {
            const progress = (audio.currentTime / audio.duration) * 100 || 0;
            progressFill.style.width = `${progress}%`;
            timeDisplay.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
        });

        audio.addEventListener('ended', () => {
            if (currentSurahNumber < 114) {
                nextSurah();
            } else {
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
                isPlaying = false;
            }
        });

        // ========== التقديم ==========
        window.seekTo = function(event) {
            const rect = progressBar.getBoundingClientRect();
            const pos = (event.clientX - rect.left) / rect.width;
            audio.currentTime = pos * audio.duration;
        };

        // ========== نسخ الآية ==========
        function copyAyah(text) {
            navigator.clipboard.writeText(text).then(() => {
                showNotification('تم نسخ الآية');
            });
        }

        // ========== إشعارات ==========
        function showNotification(msg) {
            notification.textContent = msg;
            notification.style.display = 'block';
            setTimeout(() => notification.style.display = 'none', 2000);
        }

        // ========== مشاركة ==========
        window.shareSurah = function() {
            navigator.clipboard.writeText(window.location.href);
            showNotification('تم نسخ الرابط');
        };

        // ========== العودة للرئيسية ==========
        window.backToHome = function() {
            homePage.style.display = 'block';
            juzPage.style.display = 'none';
            readerPage.style.display = 'none';
            player.classList.add('hidden');
            audio.pause();
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
        };

        // ========== التبويبات ==========
        window.switchTab = function(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            if (tab === 'surahs') {
                document.getElementById('surahsTab').style.display = 'block';
                document.getElementById('juzTab').style.display = 'none';
            } else {
                document.getElementById('surahsTab').style.display = 'none';
                document.getElementById('juzTab').style.display = 'block';
            }
        };

        // ========== البحث ==========
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const q = e.target.value.trim().toLowerCase();
            if (!q) {
                displaySurahs(allSurahs);
                return;
            }
            const filtered = allSurahs.filter(s => s.name.includes(q));
            displaySurahs(filtered);
        });

        // ========== التاريخ ==========
        function updateDate() {
            const date = new Date();
            document.getElementById('dateDisplay').textContent = date.toLocaleDateString('ar-SA');
        }

        // ========== بدء التطبيق ==========
        async function init() {
            updateDate();
            await loadRecitersFromAPI();
            await loadSurahs();
            loadJuzList();
        }

        init();
    </script>
</body>
</html>
