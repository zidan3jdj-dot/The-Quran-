<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مصحف النور الاحترافي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root { --gold: #c9a959; --dark: #0a0f1e; --panel: #1a4755; --bg-read: #f8f4e9; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Cairo', sans-serif; background: var(--dark); color: #fff; overflow-x: hidden; }
        
        /* الهيكل العام */
        .app-wrapper { max-width: 480px; margin: 0 auto; background: #07131c; min-height: 100vh; position: relative; }
        .app-content { padding: 15px 15px 120px; }

        /* الهيدر */
        .main-header { background: linear-gradient(135deg, #1a4755, #0d2b35); border-radius: 25px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--gold); text-align: center; }
        .logo-text { font-size: 24px; font-weight: 900; color: var(--gold); display: block; }

        /* الكروت */
        .surah-card, .reciter-card { background: linear-gradient(145deg, #1a4755, #0f2b3d); border: 1px solid var(--gold); border-radius: 20px; padding: 15px; margin-bottom: 10px; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: 0.3s; }
        .surah-card:hover { transform: scale(1.02); }
        .reciter-card.active { background: var(--gold); color: #000; }
        .avatar { width: 60px; height: 60px; border-radius: 15px; border: 2px solid var(--gold); overflow: hidden; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        /* شبكة الأجزاء */
        .juz-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .juz-item { background: var(--panel); border: 1px solid var(--gold); border-radius: 15px; padding: 15px 5px; text-align: center; cursor: pointer; animation: fadeIn 0.5s ease; }

        /* شاشة المصحف */
        .reader-screen { position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; height: 100vh; background: var(--bg-read); z-index: 1000; overflow-y: auto; display: none; }
        .quran-container { padding: 30px 20px; text-align: center; }
        .quran-paper { background: #fff; padding: 40px 25px; border-radius: 10px; box-shadow: 0 5px 25px rgba(0,0,0,0.1); border: 1px solid #ddd; position: relative; }
        .quran-paper::before { content: ""; position: absolute; top: 10px; left: 10px; right: 10px; bottom: 10px; border: 1px solid #e0c5a0; pointer-events: none; }
        .ayah-text { font-family: 'Amiri', serif; font-size: 28px; line-height: 2.5; color: #222; cursor: pointer; padding: 0 5px; border-radius: 5px; transition: 0.3s; }
        .active-ayah { background: #f1e4bc; color: #000; box-shadow: 0 0 10px #c9a959; }

        /* مشغل الصوت الاحترافي */
        .player-bar { position: sticky; bottom: 0; background: #1a4755; padding: 10px 20px; border-top: 3px solid var(--gold); z-index: 1100; color: #fff; }
        .player-info { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
        .player-avatar { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--gold); }
        .player-controls { display: flex; align-items: center; justify-content: space-between; gap: 15px; }
        .play-btn { background: var(--gold); color: #000; border: none; width: 45px; height: 45px; border-radius: 50%; font-size: 18px; cursor: pointer; }
        
        .progress-container { flex: 1; margin: 0 10px; position: relative; }
        .progress-bar { width: 100%; height: 6px; background: #0d2b35; border-radius: 10px; appearance: none; cursor: pointer; }
        .progress-bar::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; background: var(--gold); border-radius: 50%; }
        
        .vol-container { display: flex; align-items: center; gap: 5px; width: 80px; }
        .vol-slider { width: 100%; height: 4px; appearance: none; background: #555; border-radius: 5px; }
        .vol-slider::-webkit-slider-thumb { appearance: none; width: 10px; height: 10px; background: #fff; border-radius: 50%; }

        /* الأنميشن */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <div class="app-content">
            <div class="main-header">
                <span class="logo-text">القرآن الكريم</span>
                <div id="hijriDate" style="color:var(--gold); font-size:13px; margin-top:5px;"></div>
            </div>

            <div id="surahsTab" class="tab-pane active">
                <div id="surahList"></div>
            </div>

            <div id="juzTab" class="tab-pane" style="display:none;">
                <div class="juz-grid" id="juzGrid"></div>
            </div>

            <div id="recitersTab" class="tab-pane" style="display:none;">
                <div id="reciterList"></div>
            </div>
        </div>

        <div style="position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:#0f2b3d; border-top:2px solid var(--gold); display:flex; justify-content:space-around; padding:10px 0; z-index:500;">
            <div onclick="switchTab('surahs')" style="text-align:center; color:var(--gold); cursor:pointer;"><i class="fas fa-book"></i><div style="font-size:10px;">السور</div></div>
            <div onclick="switchTab('juz')" style="text-align:center; color:#7f8c8d; cursor:pointer;"><i class="fas fa-layer-group"></i><div style="font-size:10px;">الأجزاء</div></div>
            <div onclick="switchTab('reciters')" style="text-align:center; color:#7f8c8d; cursor:pointer;"><i class="fas fa-microphone"></i><div style="font-size:10px;">القراء</div></div>
        </div>
    </div>

    <div id="readerScreen" class="reader-screen">
        <div style="background:var(--panel); padding:15px; display:flex; align-items:center; position:sticky; top:0; z-index:10;">
            <i class="fas fa-arrow-right" onclick="closeReader()" style="color:var(--gold); font-size:20px; cursor:pointer;"></i>
            <h3 id="surahTitle" style="color:var(--gold); flex:1; text-align:center;">اسم السورة</h3>
        </div>
        
        <div class="quran-container">
            <div class="quran-paper" id="quranContent"></div>
        </div>

        <div class="player-bar">
            <div class="player-info">
                <img src="1.jpeg" id="pAvatar" class="player-avatar">
                <div style="flex:1">
                    <div id="pName" style="font-weight:700; font-size:14px; color:var(--gold);">المنشاوي</div>
                    <div id="pAyahInfo" style="font-size:11px; opacity:0.8;">الآية: --</div>
                </div>
                <div id="timeInfo" style="font-size:12px; font-family:monospace;">00:00</div>
            </div>

            <div class="player-controls">
                <button class="play-btn" onclick="togglePlay()"><i id="playIcon" class="fas fa-play"></i></button>
                
                <div class="progress-container">
                    <input type="range" id="progBar" class="progress-bar" value="0" min="0" step="0.1">
                </div>

                <div class="vol-container">
                    <i class="fas fa-volume-up" style="font-size:12px;"></i>
                    <input type="range" id="volBar" class="vol-slider" min="0" max="1" step="0.1" value="0.8">
                </div>
            </div>
        </div>
    </div>

    <script>
        const API = "https://api.alquran.cloud/v1";
        const RECITERS = [
            { id: 'ar.minshawi', name: 'محمد صديق المنشاوي', img: '1.jpeg' },
            { id: 'ar.abdulsamad', name: 'عبد الباسط عبد الصمد', img: '2.jpeg' },
            { id: 'ar.alafasy', name: 'مشاري العفاسي', img: '3.jpeg' },
            { id: 'ar.yasseraddossari', name: 'ياسر الدوسري', img: '4.jpeg' }
        ];

        let activeReciter = RECITERS[0];
        let audio = new Audio();
        let currentAyahs = [];
        let currentIdx = 0;

        // تهيئة
        async function init() {
            setHijri();
            renderReciters();
            renderJuz();
            await loadSurahs();
            setupPlayerEvents();
        }

        function setHijri() {
            const date = new Date().toLocaleDateString('ar-SA', { calendar: 'islamic-umalqura', day: 'numeric', month: 'long', year: 'numeric' });
            document.getElementById('hijriDate').innerText = date;
        }

        async function loadSurahs() {
            const res = await fetch(`${API}/surah`);
            const data = await res.json();
            document.getElementById('surahList').innerHTML = data.data.map(s => `
                <div class="surah-card" onclick="openSurah(${s.number}, '${s.name}')">
                    <div style="background:var(--gold); color:#000; width:35px; height:35px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold;">${s.number}</div>
                    <div style="flex:1; font-weight:700;">${s.name}</div>
                    <div style="font-size:12px; opacity:0.6;">${s.numberOfAyahs} آية</div>
                </div>
            `).join('');
        }

        function renderReciters() {
            document.getElementById('reciterList').innerHTML = RECITERS.map(r => `
                <div class="reciter-card ${activeReciter.id === r.id ? 'active' : ''}" onclick="selectReciter('${r.id}')">
                    <div class="avatar"><img src="${r.img}"></div>
                    <div style="font-weight:bold;">${r.name}</div>
                </div>
            `).join('');
        }

        function selectReciter(id) {
            activeReciter = RECITERS.find(r => r.id === id);
            renderReciters();
            document.getElementById('pAvatar').src = activeReciter.img;
            document.getElementById('pName').innerText = activeReciter.name;
        }

        function renderJuz() {
            const grid = document.getElementById('juzGrid');
            for(let i=1; i<=30; i++) {
                grid.innerHTML += `<div class="juz-item" onclick="openJuz(${i})"><span style="color:var(--gold); font-weight:900;">${i}</span><br><small>الجزء</small></div>`;
            }
        }

        async function openJuz(num) {
            // تأثير فتح السور التابعة للجزء
            const res = await fetch(`${API}/juz/${num}/quran-uthmani`);
            const data = await res.json();
            const surahsMap = {};
            data.data.ayahs.forEach(a => surahsMap[a.surah.number] = a.surah.name);
            
            const html = Object.entries(surahsMap).map(([id, name]) => `
                <div class="surah-card" onclick="openSurah(${id}, '${name}')">
                    <div style="background:var(--gold); color:#000; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold;">${id}</div>
                    <div style="flex:1;">${name}</div>
                </div>
            `).join('');
            
            document.getElementById('surahList').innerHTML = `<h3 style="color:var(--gold); margin-bottom:15px; animation:fadeIn 0.5s;">سور الجزء ${num}</h3>` + html;
            switchTab('surahs');
        }

        async function openSurah(num, name) {
            document.getElementById('readerScreen').style.display = 'block';
            document.getElementById('surahTitle').innerText = name;
            document.getElementById('quranContent').innerHTML = "جاري فتح المصحف...";
            
            const res = await fetch(`${API}/surah/${num}/quran-uthmani`);
            const data = await res.json();
            currentAyahs = data.data.ayahs;
            
            document.getElementById('quranContent').innerHTML = currentAyahs.map((a, i) => `
                <span class="ayah-text" id="ay-${i}" onclick="playAyah(${i})">
                    ${a.text} <span style="color:var(--gold); font-family:sans-serif; font-size:18px;">﴿${a.numberInSurah}﴾</span>
                </span>
            `).join(' ');
        }

        function playAyah(index) {
            currentIdx = index;
            const a = currentAyahs[index];
            
            document.querySelectorAll('.ayah-text').forEach(el => el.classList.remove('active-ayah'));
            const el = document.getElementById(`ay-${index}`);
            el.classList.add('active-ayah');
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });

            // روابط API صوتية مباشرة ومضمونة
            audio.src = `https://cdn.islamic.network/quran/audio/128/${activeReciter.id}/${a.number}.mp3`;
            audio.play().catch(() => alert("عذراً، تعذر تشغيل الصوت حالياً"));
            
            document.getElementById('pAyahInfo').innerText = `الآية: ${a.numberInSurah}`;
            document.getElementById('playIcon').className = 'fas fa-pause';
        }

        function togglePlay() {
            if(audio.paused) { audio.play(); document.getElementById('playIcon').className = 'fas fa-pause'; }
            else { audio.pause(); document.getElementById('playIcon').className = 'fas fa-play'; }
        }

        function setupPlayerEvents() {
            audio.ontimeupdate = () => {
                const prog = (audio.currentTime / audio.duration) * 100;
                document.getElementById('progBar').value = prog || 0;
                
                const m = Math.floor(audio.currentTime / 60);
                const s = Math.floor(audio.currentTime % 60);
                document.getElementById('timeInfo').innerText = `${m}:${s < 10 ? '0'+s : s}`;
            };

            document.getElementById('progBar').oninput = (e) => {
                const seekTime = (e.target.value / 100) * audio.duration;
                audio.currentTime = seekTime;
            };

            document.getElementById('volBar').oninput = (e) => {
                audio.volume = e.target.value;
            };

            audio.onended = () => {
                if(currentIdx < currentAyahs.length - 1) playAyah(currentIdx + 1);
            };
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-pane').forEach(p => p.style.display = 'none');
            document.getElementById(tab + 'Tab').style.display = 'block';
        }

        function closeReader() {
            audio.pause();
            document.getElementById('readerScreen').style.display = 'none';
        }

        init();
    </script>
</body>
</html>
