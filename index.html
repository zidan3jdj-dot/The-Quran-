<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>القرآن الكريم | تلاوات خاشعة</title>
    <!-- الخطوط الحديثة -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <!-- أيقونات Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* نفس التصميم السابق مع تحسينات بسيطة */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #1e2b3a 0%, #2c3e50 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: "﷽";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-5deg);
            font-size: 30vw;
            opacity: 0.03;
            color: #ffd700;
            font-weight: 900;
            pointer-events: none;
            z-index: 0;
            font-family: 'Amiri', serif;
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px 20px 100px;
        }

        .header {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 60px;
            padding: 15px 25px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, #ffd700, #ffa500);
            color: #1e2b3a;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 22px;
        }

        .date-badge {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 15px;
            color: #ffd700;
        }

        .tabs-modern {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .tab-modern {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.2);
            color: #fff;
            padding: 15px 35px;
            border-radius: 50px;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tab-modern i {
            color: #ffd700;
        }

        .tab-modern.active {
            background: linear-gradient(135deg, #ffd700, #ffa500);
            color: #1e2b3a;
        }

        .tab-modern.active i {
            color: #1e2b3a;
        }

        .search-wrapper {
            position: relative;
            margin-bottom: 30px;
        }

        .search-box-modern {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 215, 0, 0.2);
            border-radius: 60px;
            padding: 5px 25px;
            display: flex;
            align-items: center;
        }

        .search-box-modern:focus-within {
            border-color: #ffd700;
        }

        .search-box-modern i {
            font-size: 22px;
            color: #ffd700;
            margin-left: 15px;
        }

        .search-box-modern input {
            background: transparent;
            border: none;
            width: 100%;
            padding: 15px 0;
            font-size: 18px;
            color: #fff;
            outline: none;
        }

        .search-count {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 215, 0, 0.15);
            padding: 5px 15px;
            border-radius: 30px;
            color: #ffd700;
        }

        .surah-grid-modern {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .surah-card-modern {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 30px;
            padding: 25px;
            cursor: pointer;
            transition: 0.4s;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .surah-card-modern:hover {
            transform: translateY(-5px);
            border-color: #ffd700;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .surah-number-modern {
            background: linear-gradient(135deg, #ffd700, #ffa500);
            color: #1e2b3a;
            width: 60px;
            height: 60px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 800;
        }

        .surah-name-modern {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .surah-meta-modern {
            display: flex;
            gap: 15px;
            color: #ffd700;
            font-size: 15px;
        }

        .juz-grid-modern {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
        }

        .juz-card-modern {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 25px;
            padding: 25px 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.4s;
        }

        .juz-card-modern:hover {
            transform: translateY(-5px);
            border-color: #ffd700;
        }

        .juz-number-modern {
            font-size: 42px;
            font-weight: 800;
            color: #ffd700;
        }

        .reader-header-modern {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 40px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .nav-modern {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .nav-btn-modern {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: #ffd700;
            padding: 12px 25px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn-modern:hover {
            background: #ffd700;
            color: #1e2b3a;
        }

        .surah-badge-modern {
            background: rgba(255, 215, 0, 0.15);
            padding: 12px 30px;
            border-radius: 40px;
            font-size: 22px;
            font-weight: 700;
            color: #ffd700;
            margin-right: auto;
        }

        /* ===== قسم القراء ===== */
        .reciters-section-modern {
            margin-top: 15px;
        }

        .reciters-label-modern {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ffd700;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .reciters-scroll-modern {
            overflow-x: auto;
            padding: 10px 5px 20px;
            scrollbar-width: thin;
            scrollbar-color: #ffd700 #2c3e50;
            -webkit-overflow-scrolling: touch;
        }

        .reciters-list-modern {
            display: flex;
            gap: 20px;
            width: max-content;
            padding: 5px;
        }

        .reciter-card-modern {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 20px 25px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 215, 0, 0.2);
            border-radius: 70px;
            cursor: pointer;
            transition: 0.4s;
            min-width: 140px;
        }

        .reciter-card-modern:hover {
            transform: translateY(-5px);
            border-color: #ffd700;
        }

        .reciter-card-modern.active {
            background: linear-gradient(135deg, #ffd700, #ffa500);
        }

        .reciter-card-modern.active span {
            color: #1e2b3a;
        }

        .reciter-card-modern.active img {
            border-color: #1e2b3a;
        }

        .reciter-card-modern img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffd700;
            transition: 0.3s;
        }

        .reciter-card-modern span {
            font-size: 16px;
            font-weight: 600;
        }

        /* ===== المصحف ===== */
        .mushaf-luxury {
            background: linear-gradient(145deg, #fdf9e6, #f5e6d3);
            border-radius: 50px 50px 30px 30px;
            padding: 30px 25px;
            margin: 25px 0 30px;
            box-shadow: 0 0 0 4px #2c3e50, 0 0 0 8px #ffd700, 0 20px 40px rgba(0, 0, 0, 0.5);
            color: #1e2b3a;
            line-height: 2.8;
            font-size: 26px;
            font-family: 'Amiri', serif;
        }

        @media (max-width: 768px) {
            .mushaf-luxury {
                font-size: 22px;
                padding: 20px;
            }
        }

        .bismillah-luxury {
            font-size: 32px;
            color: #2c3e50;
            text-align: center;
            border-bottom: 2px dashed #ffd700;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .ayah-number-luxury {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ffd700, #ffa500);
            color: #1e2b3a;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 14px;
            margin: 0 8px 0 15px;
            border: 2px solid #2c3e50;
        }

        .copy-btn-luxury {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: 1px solid #ffd700;
            color: #2c3e50;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 12px;
            margin: 0 4px;
            cursor: pointer;
            transition: 0.3s;
        }

        .copy-btn-luxury:hover {
            background: #ffd700;
            color: #1e2b3a;
            transform: rotate(180deg);
        }

        /* ===== المشغل ===== */
        .player-modern {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(30, 43, 58, 0.98);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 80px;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            gap: 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            z-index: 2000;
        }

        .player-modern.hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .player-modern {
                flex-direction: column;
                border-radius: 50px;
            }
        }

        .player-controls-modern {
            display: flex;
            gap: 12px;
        }

        .control-btn-modern {
            background: linear-gradient(135deg, #ffd700, #ffa500);
            border: none;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            color: #1e2b3a;
            transition: 0.3s;
        }

        .control-btn-modern:hover:not(:disabled) {
            transform: scale(1.1);
        }

        .control-btn-modern:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .progress-bar-modern {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            cursor: pointer;
        }

        .progress-fill-modern {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ffd700, #ffa500);
            border-radius: 6px;
        }

        .time-modern {
            color: #ffd700;
            font-size: 15px;
            min-width: 85px;
            text-align: center;
        }

        .notification-modern {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #ffd700, #ffa500);
            color: #1e2b3a;
            padding: 15px 40px;
            border-radius: 60px;
            font-weight: 700;
            display: none;
            z-index: 5000;
        }

        .go-top-modern {
            position: fixed;
            bottom: 100px;
            left: 20px;
            background: linear-gradient(135deg, #ffd700, #ffa500);
            color: #1e2b3a;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
        }

        .go-top-modern.show {
            opacity: 1;
            visibility: visible;
        }

        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1e2b3a;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            transition: opacity 0.5s ease;
        }

        .loading-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .loader-modern i {
            font-size: 70px;
            color: #ffd700;
            animation: spin 2s ease-in-out infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- شاشة التحميل -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loader-modern">
            <i class="fas fa-quran"></i>
            <p style="color: #ffd700; font-size: 24px; margin-top: 20px;">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</p>
        </div>
    </div>

    <div class="container">
        <!-- الهيدر -->
        <div class="header">
            <div class="logo">
                <i class="fas fa-quran"></i>
                <span>القرآن الكريم</span>
            </div>
            <div class="date-badge" id="dateDisplay"></div>
        </div>

        <!-- الصفحة الرئيسية -->
        <div id="homePage">
            <div class="tabs-modern">
                <button class="tab-modern active" onclick="switchTab('surahs')">
                    <i class="fas fa-list-ul"></i> السور
                </button>
                <button class="tab-modern" onclick="switchTab('juz')">
                    <i class="fas fa-layer-group"></i> الأجزاء
                </button>
            </div>

            <div class="search-wrapper">
                <div class="search-box-modern">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="ابحث عن سورة...">
                </div>
                <span class="search-count" id="searchCount"></span>
            </div>

            <div id="surahsTab">
                <div class="surah-grid-modern" id="surahList"></div>
            </div>

            <div id="juzTab" style="display: none;">
                <div class="juz-grid-modern" id="juzList"></div>
            </div>
        </div>

        <!-- صفحة الأجزاء -->
        <div id="juzPage" style="display: none;">
            <div class="reader-header-modern">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <button class="nav-btn-modern" onclick="backToHome()">
                        <i class="fas fa-arrow-right"></i> العودة
                    </button>
                    <div class="surah-badge-modern" id="juzTitle"></div>
                </div>
            </div>
            <div class="surah-grid-modern" id="juzSurahsList"></div>
        </div>

        <!-- صفحة التلاوة -->
        <div id="readerPage" style="display: none;">
            <div class="reader-header-modern">
                <div class="nav-modern">
                    <button class="nav-btn-modern" onclick="backToHome()">
                        <i class="fas fa-home"></i> الرئيسية
                    </button>
                    <div class="surah-badge-modern" id="surahName"></div>
                    <button class="nav-btn-modern" onclick="shareSurah()">
                        <i class="fas fa-share-alt"></i>
                    </button>
                </div>

                <!-- القراء مع الصور -->
                <div class="reciters-section-modern">
                    <div class="reciters-label-modern">
                        <i class="fas fa-microphone-alt"></i>
                        <span>اختر القارئ</span>
                    </div>
                    <div class="reciters-scroll-modern">
                        <div class="reciters-list-modern" id="recitersList"></div>
                    </div>
                </div>
            </div>

            <div style="background: rgba(255,255,255,0.05); border-radius: 40px; padding: 20px; margin-bottom: 20px; text-align: center;">
                <div style="color: #ffd700; font-size: 28px; font-weight: 700;" id="surahNameLarge"></div>
                <div style="display: flex; gap: 20px; justify-content: center; margin-top: 5px;" id="surahInfo"></div>
            </div>

            <div class="mushaf-luxury" id="ayahsContainer"></div>
        </div>
    </div>

    <!-- المشغل -->
    <div class="player-modern hidden" id="player">
        <div class="player-controls-modern">
            <button class="control-btn-modern" onclick="prevSurah()" id="prevBtn"><i class="fas fa-step-backward"></i></button>
            <button class="control-btn-modern" onclick="togglePlay()" id="playBtn"><i class="fas fa-play"></i></button>
            <button class="control-btn-modern" onclick="nextSurah()" id="nextBtn"><i class="fas fa-step-forward"></i></button>
        </div>
        <div style="flex: 1;">
            <div style="display: flex; justify-content: space-between; color: #ffd700; margin-bottom: 5px;">
                <span id="nowPlaying"></span>
                <span id="currentReciter"></span>
            </div>
            <div style="display: flex; align-items: center; gap: 15px;">
                <div class="progress-bar-modern" id="progressBar" onclick="seekTo(event)">
                    <div class="progress-fill-modern" id="progressFill"></div>
                </div>
                <span class="time-modern" id="timeDisplay">00:00 / 00:00</span>
            </div>
        </div>
        <audio id="audio" preload="metadata"></audio>
    </div>

    <!-- زر العودة للأعلى -->
    <div class="go-top-modern" id="goTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">
        <i class="fas fa-arrow-up"></i>
    </div>

    <!-- الإشعارات -->
    <div class="notification-modern" id="notification"></div>

    <script>
        // ========== API ==========
        const API_QURAN = "https://api.alquran.cloud/v1";

        // ========== القراء مع روابط صوت مؤكدة 100% تعمل ==========
        const reciters = [
            { 
                id: 4, 
                name: 'محمد المنشاوي', 
                img: '3.jpeg',
                // روابط مؤكدة من المصدر الرسمي
                url: 'https://download.quranicaudio.com/quran/minshawi_murattal/'
            },
            { 
                id: 1, 
                name: 'عبد الباسط عبد الصمد', 
                img: '2.jpeg',
                url: 'https://download.quranicaudio.com/quran/abdulbaset_murattal/'
            },
            { 
                id: 6, 
                name: 'مشاري العفاسي', 
                img: '1.jpeg',
                url: 'https://download.quranicaudio.com/quran/afasy/'
            },
            { 
                id: 235, 
                name: 'ياسر الدوسري', 
                img: '4.jpeg',
                url: 'https://download.quranicaudio.com/quran/dosari/'
            }
        ];

        // ========== متغيرات عامة ==========
        let allSurahs = [];
        let currentSurah = null;
        let currentReciter = reciters[2]; // مشاري العفاسي
        let currentSurahNumber = 1;
        let ayahs = [];
        let isPlaying = false;

        // عناصر DOM
        const homePage = document.getElementById('homePage');
        const juzPage = document.getElementById('juzPage');
        const readerPage = document.getElementById('readerPage');
        const surahList = document.getElementById('surahList');
        const juzList = document.getElementById('juzList');
        const juzSurahsList = document.getElementById('juzSurahsList');
        const ayahsContainer = document.getElementById('ayahsContainer');
        const audio = document.getElementById('audio');
        const player = document.getElementById('player');
        const playBtn = document.getElementById('playBtn');
        const progressFill = document.getElementById('progressFill');
        const timeDisplay = document.getElementById('timeDisplay');
        const progressBar = document.getElementById('progressBar');
        const notification = document.getElementById('notification');
        const recitersList = document.getElementById('recitersList');
        const nowPlaying = document.getElementById('nowPlaying');
        const currentReciterSpan = document.getElementById('currentReciter');
        const surahName = document.getElementById('surahName');
        const surahNameLarge = document.getElementById('surahNameLarge');
        const surahInfo = document.getElementById('surahInfo');
        const loadingScreen = document.getElementById('loadingScreen');
        const searchCount = document.getElementById('searchCount');

        // إخفاء شاشة التحميل
        setTimeout(() => {
            loadingScreen.classList.add('fade-out');
        }, 2000);

        // ========== عرض القراء مع الصور ==========
        function displayReciters() {
            recitersList.innerHTML = '';
            reciters.forEach(reciter => {
                const div = document.createElement('div');
                div.className = `reciter-card-modern ${reciter.id === currentReciter.id ? 'active' : ''}`;
                div.innerHTML = `
                    <img src="${reciter.img}" alt="${reciter.name}" onerror="this.src='https://via.placeholder.com/80x80/2c3e50/ffd700?text=${reciter.name.charAt(0)}'">
                    <span>${reciter.name}</span>
                `;
                div.onclick = (e) => selectReciter(reciter, e);
                recitersList.appendChild(div);
            });
        }

        function selectReciter(reciter, event) {
            currentReciter = reciter;
            
            document.querySelectorAll('.reciter-card-modern').forEach(item => {
                item.classList.remove('active');
            });
            event.currentTarget.classList.add('active');
            
            currentReciterSpan.textContent = reciter.name;
            
            if (currentSurahNumber) {
                loadSurahAudio(currentSurahNumber);
            }
            
            showNotification(`تم اختيار ${reciter.name}`);
        }

        // ========== تحميل السور ==========
        async function loadSurahs() {
            try {
                const res = await fetch(`${API_QURAN}/surah`);
                const data = await res.json();
                allSurahs = data.data;
                displaySurahs(allSurahs);
                updateSearchCount(allSurahs.length);
            } catch (e) {
                surahList.innerHTML = '<div class="loader-modern">خطأ في التحميل</div>';
            }
        }

        function displaySurahs(surahs) {
            surahList.innerHTML = '';
            surahs.forEach(s => {
                const card = document.createElement('div');
                card.className = 'surah-card-modern';
                card.innerHTML = `
                    <div class="surah-number-modern">${s.number}</div>
                    <div class="surah-info-modern">
                        <div class="surah-name-modern">${s.name}</div>
                        <div class="surah-meta-modern">
                            <span><i class="fas fa-${s.revelationType === 'Meccan' ? 'city' : 'mosque'}"></i> ${s.revelationType === 'Meccan' ? 'مكية' : 'مدنية'}</span>
                            <span><i class="fas fa-quran"></i> ${s.numberOfAyahs} آيات</span>
                        </div>
                    </div>
                `;
                card.onclick = () => openSurah(s);
                surahList.appendChild(card);
            });
        }

        function updateSearchCount(count) {
            searchCount.textContent = `${count} سورة`;
        }

        // ========== تحميل الأجزاء ==========
        function loadJuzList() {
            juzList.innerHTML = '';
            for (let i = 1; i <= 30; i++) {
                const card = document.createElement('div');
                card.className = 'juz-card-modern';
                card.innerHTML = `
                    <div class="juz-number-modern">${i}</div>
                    <div class="juz-text-modern">الجزء ${i}</div>
                `;
                card.onclick = () => openJuz(i);
                juzList.appendChild(card);
            }
        }

        // ========== فتح الجزء ==========
        async function openJuz(juzNumber) {
            try {
                homePage.style.display = 'none';
                juzPage.style.display = 'block';
                document.getElementById('juzTitle').textContent = `الجزء ${juzNumber}`;
                juzSurahsList.innerHTML = '<div class="loader-modern"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</div>';

                const res = await fetch(`${API_QURAN}/juz/${juzNumber}/quran-uthmani`);
                const data = await res.json();
                
                const surahsInJuz = [];
                const seen = new Set();
                
                data.data.ayahs.forEach(ayah => {
                    if (!seen.has(ayah.surah.number)) {
                        seen.add(ayah.surah.number);
                        surahsInJuz.push({
                            number: ayah.surah.number,
                            name: ayah.surah.name,
                            type: ayah.surah.revelationType,
                            ayahs: ayah.surah.numberOfAyahs
                        });
                    }
                });

                juzSurahsList.innerHTML = '';
                surahsInJuz.forEach(s => {
                    const card = document.createElement('div');
                    card.className = 'surah-card-modern';
                    card.innerHTML = `
                        <div class="surah-number-modern">${s.number}</div>
                        <div class="surah-info-modern">
                            <div class="surah-name-modern">${s.name}</div>
                            <div class="surah-meta-modern">
                                <span><i class="fas fa-${s.type === 'Meccan' ? 'city' : 'mosque'}"></i> ${s.type === 'Meccan' ? 'مكية' : 'مدنية'}</span>
                                <span><i class="fas fa-quran"></i> ${s.ayahs} آيات</span>
                            </div>
                        </div>
                    `;
                    card.onclick = () => openSurah(s);
                    juzSurahsList.appendChild(card);
                });
            } catch (e) {
                juzSurahsList.innerHTML = '<div class="loader-modern">خطأ في التحميل</div>';
            }
        }

        // ========== فتح السورة ==========
        async function openSurah(surah) {
            try {
                homePage.style.display = 'none';
                juzPage.style.display = 'none';
                readerPage.style.display = 'block';
                
                currentSurah = surah;
                currentSurahNumber = surah.number;
                
                surahName.textContent = `سورة ${surah.name}`;
                surahNameLarge.textContent = `سورة ${surah.name}`;
                surahInfo.innerHTML = `
                    <span><i class="fas fa-book-open"></i> ${surah.numberOfAyahs} آيات</span>
                    <span><i class="fas fa-city"></i> ${surah.revelationType === 'Meccan' ? 'مكية' : 'مدنية'}</span>
                `;
                
                nowPlaying.textContent = `سورة ${surah.name}`;
                currentReciterSpan.textContent = currentReciter.name;
                
                player.classList.remove('hidden');
                
                await loadSurahAyahs(surah.number);
                await loadSurahAudio(surah.number);
                
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (e) {
                showNotification('خطأ في تحميل السورة');
            }
        }

        // ========== تحميل الآيات ==========
        async function loadSurahAyahs(surahNumber) {
            try {
                ayahsContainer.innerHTML = '<div class="loader-modern"><i class="fas fa-spinner fa-spin"></i> جاري تحميل الآيات...</div>';
                
                const res = await fetch(`${API_QURAN}/surah/${surahNumber}/quran-uthmani`);
                const data = await res.json();
                ayahs = data.data.ayahs;
                
                displayAyahs();
            } catch (e) {
                ayahsContainer.innerHTML = '<div class="loader-modern">خطأ في التحميل</div>';
            }
        }

        function displayAyahs() {
            ayahsContainer.innerHTML = '';
            
            if (currentSurahNumber !== 9) {
                const b = document.createElement('div');
                b.className = 'bismillah-luxury';
                b.textContent = 'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ';
                ayahsContainer.appendChild(b);
            }
            
            ayahs.forEach((a, i) => {
                const wrapper = document.createElement('span');
                wrapper.className = 'ayah-wrapper';
                
                const text = document.createElement('span');
                text.className = 'ayah-text';
                text.textContent = a.text;
                
                const number = document.createElement('span');
                number.className = 'ayah-number-luxury';
                number.textContent = a.numberInSurah;
                
                const copy = document.createElement('span');
                copy.className = 'copy-btn-luxury';
                copy.innerHTML = '<i class="fas fa-copy"></i>';
                copy.onclick = (e) => {
                    e.stopPropagation();
                    copyAyah(a.text);
                };
                
                wrapper.appendChild(text);
                wrapper.appendChild(number);
                wrapper.appendChild(copy);
                ayahsContainer.appendChild(wrapper);
            });
        }

        // ========== تحميل الصوت - تم الإصلاح ==========
        async function loadSurahAudio(surahNumber) {
            try {
                showNotification('جاري تحميل الصوت...');
                
                // بناء رابط الصوت الصحيح
                const surahNumStr = surahNumber.toString().padStart(3, '0');
                // إضافة 001 بدلاً من 1
                const audioUrl = `${currentReciter.url}${surahNumStr}.mp3`;
                
                console.log('تحميل من:', audioUrl);
                
                // تجربة الرابط البديل إذا فشل
                audio.src = audioUrl;
                audio.load();
                
                // تأكيد نجاح التحميل
                audio.addEventListener('canplay', () => {
                    showNotification('تم تحميل الصوت بنجاح');
                }, { once: true });
                
                // معالجة الخطأ
                audio.addEventListener('error', (e) => {
                    console.log('خطأ في الرابط:', audioUrl);
                    // تجربة رابط بديل
                    const backupUrl = `https://server6.mp3quran.net/${currentReciter.name === 'مشاري العفاسي' ? 'afasy' : 
                                                                    currentReciter.name === 'عبد الباسط عبد الصمد' ? 'basit' : 
                                                                    currentReciter.name === 'محمد المنشاوي' ? 'minsh' : 'dosary'}/${surahNumStr}.mp3`;
                    console.log('محاولة الرابط البديل:', backupUrl);
                    audio.src = backupUrl;
                    audio.load();
                }, { once: true });
                
                document.getElementById('prevBtn').disabled = currentSurahNumber <= 1;
                document.getElementById('nextBtn').disabled = currentSurahNumber >= 114;
                
            } catch (e) {
                console.log('خطأ:', e);
                showNotification('فشل تحميل الصوت');
            }
        }

        // ========== مشغل الصوت ==========
        function togglePlay() {
            if (audio.paused) {
                audio.play().catch(e => {
                    console.log('خطأ في التشغيل:', e);
                    showNotification('تعذر تشغيل الصوت - تأكد من اتصال الإنترنت');
                });
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                isPlaying = true;
            } else {
                audio.pause();
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
                isPlaying = false;
            }
        }

        function prevSurah() {
            if (currentSurahNumber > 1) {
                const prevSurah = allSurahs[currentSurahNumber - 2];
                if (prevSurah) openSurah(prevSurah);
            }
        }

        function nextSurah() {
            if (currentSurahNumber < 114) {
                const nextSurah = allSurahs[currentSurahNumber];
                if (nextSurah) openSurah(nextSurah);
            }
        }

        // ========== تحديث الوقت ==========
        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        audio.addEventListener('loadedmetadata', () => {
            if (audio.duration && !isNaN(audio.duration)) {
                timeDisplay.textContent = `00:00 / ${formatTime(audio.duration)}`;
            }
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration && !isNaN(audio.duration)) {
                const progress = (audio.currentTime / audio.duration) * 100 || 0;
                progressFill.style.width = `${progress}%`;
                timeDisplay.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
            }
        });

        audio.addEventListener('ended', () => {
            if (currentSurahNumber < 114) {
                nextSurah();
            } else {
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
                isPlaying = false;
            }
        });

        // ========== التقديم ==========
        window.seekTo = function(event) {
            const rect = progressBar.getBoundingClientRect();
            const pos = (event.clientX - rect.left) / rect.width;
            audio.currentTime = pos * audio.duration;
        };

        // ========== نسخ الآية ==========
        function copyAyah(text) {
            navigator.clipboard.writeText(text).then(() => {
                showNotification('تم نسخ الآية');
            });
        }

        // ========== إشعارات ==========
        function showNotification(msg) {
            notification.textContent = msg;
            notification.style.display = 'block';
            setTimeout(() => notification.style.display = 'none', 2000);
        }

        // ========== مشاركة ==========
        window.shareSurah = function() {
            navigator.clipboard.writeText(window.location.href);
            showNotification('تم نسخ الرابط');
        };

        // ========== العودة للرئيسية ==========
        window.backToHome = function() {
            homePage.style.display = 'block';
            juzPage.style.display = 'none';
            readerPage.style.display = 'none';
            player.classList.add('hidden');
            audio.pause();
            audio.src = '';
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
        };

        // ========== التبويبات ==========
        window.switchTab = function(tab) {
            document.querySelectorAll('.tab-modern').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            if (tab === 'surahs') {
                document.getElementById('surahsTab').style.display = 'block';
                document.getElementById('juzTab').style.display = 'none';
            } else {
                document.getElementById('surahsTab').style.display = 'none';
                document.getElementById('juzTab').style.display = 'block';
            }
        };

        // ========== البحث ==========
        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                const q = e.target.value.trim().toLowerCase();
                if (!q) {
                    displaySurahs(allSurahs);
                    updateSearchCount(allSurahs.length);
                    return;
                }
                const filtered = allSurahs.filter(s => s.name.includes(q));
                displaySurahs(filtered);
                updateSearchCount(filtered.length);
            }, 300);
        });

        // ========== زر العودة للأعلى ==========
        window.addEventListener('scroll', () => {
            document.getElementById('goTop').classList.toggle('show', window.scrollY > 300);
        });

        // ========== التاريخ ==========
        function updateDate() {
            const date = new Date();
            document.getElementById('dateDisplay').textContent = date.toLocaleDateString('ar-SA');
        }

        // ========== بدء التطبيق ==========
        async function init() {
            updateDate();
            displayReciters();
            await loadSurahs();
            loadJuzList();
        }

        init();
    </script>
</body>
</html>
