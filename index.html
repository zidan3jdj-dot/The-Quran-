<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>آيات - القرآن الكريم</title>
    <!-- الخطوط -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <!-- أيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', 'Amiri', sans-serif;
            background: #0f172a;
            min-height: 100vh;
            color: #e2e8f0;
        }

        /* ===== التصميم الجديد ===== */
        .app-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px 16px 100px;
            position: relative;
        }

        /* الهيدر */
        .app-header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            padding: 16px;
            border-radius: 24px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            border: 1px solid #334155;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .app-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .app-logo i {
            font-size: 28px;
            color: #fbbf24;
            background: #1e293b;
            padding: 10px;
            border-radius: 16px;
            box-shadow: 0 4px 0 #b45309;
        }

        .app-logo span {
            font-size: 24px;
            font-weight: 700;
            color: #fbbf24;
        }

        .quran-verse {
            background: linear-gradient(145deg, #059669, #047857);
            padding: 12px 16px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid #fbbf24;
        }

        .quran-verse p {
            font-size: 20px;
            font-weight: 600;
            color: #fef3c7;
            margin-bottom: 5px;
        }

        .quran-verse small {
            color: #d1d5db;
            font-size: 14px;
        }

        /* شريط التبويبات السفلي */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #1e293b;
            border-top: 2px solid #fbbf24;
            display: flex;
            justify-content: space-around;
            padding: 8px 0 12px;
            z-index: 1000;
            border-radius: 30px 30px 0 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #94a3b8;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            flex: 1;
        }

        .nav-item i {
            font-size: 22px;
        }

        .nav-item.active {
            color: #fbbf24;
        }

        .nav-item.active i {
            transform: translateY(-2px);
        }

        /* ===== تبويب السور ===== */
        .surah-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .surah-item {
            background: #1e293b;
            padding: 16px 20px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            border: 1px solid #334155;
            transition: 0.2s;
        }

        .surah-item:hover {
            border-color: #fbbf24;
            background: #2d3a4f;
        }

        .surah-number {
            background: #fbbf24;
            color: #0f172a;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            font-weight: 700;
            font-size: 20px;
            box-shadow: 0 4px 0 #b45309;
        }

        .surah-info {
            flex: 1;
        }

        .surah-name {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .surah-details {
            display: flex;
            gap: 12px;
            color: #94a3b8;
            font-size: 14px;
        }

        /* ===== تبويب القراء ===== */
        .reciters-search {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 30px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0 20px;
        }

        .reciters-search i {
            color: #fbbf24;
            font-size: 20px;
        }

        .reciters-search input {
            background: transparent;
            border: none;
            color: #e2e8f0;
            font-size: 18px;
            width: 100%;
            outline: none;
            font-family: 'Cairo', sans-serif;
        }

        .reciters-search input::placeholder {
            color: #64748b;
        }

        .reciters-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .reciter-item {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .reciter-item:hover {
            border-color: #fbbf24;
            background: #2d3a4f;
        }

        .reciter-item.active {
            background: linear-gradient(145deg, #059669, #047857);
            border-color: #fbbf24;
        }

        .reciter-icon {
            width: 50px;
            height: 50px;
            background: #fbbf24;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0f172a;
            font-size: 24px;
            font-weight: 700;
            box-shadow: 0 4px 0 #b45309;
        }

        .reciter-info {
            flex: 1;
        }

        .reciter-name {
            font-size: 18px;
            font-weight: 600;
        }

        .reciter-name small {
            color: #94a3b8;
            font-size: 14px;
            margin-right: 8px;
        }

        /* ===== تبويب الأجزاء ===== */
        .juz-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-top: 15px;
        }

        .juz-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 12px 4px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .juz-card:hover {
            border-color: #fbbf24;
            background: #2d3a4f;
        }

        .juz-number {
            font-size: 22px;
            font-weight: 700;
            color: #fbbf24;
        }

        .juz-text {
            font-size: 14px;
            color: #94a3b8;
        }

        /* ===== صفحة القراءة ===== */
        .reader-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f172a;
            z-index: 2000;
            overflow-y: auto;
            padding: 16px 16px 120px;
            display: none;
        }

        .reader-header {
            background: #1e293b;
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #334155;
        }

        .reader-nav {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .back-btn {
            background: transparent;
            border: 1px solid #fbbf24;
            color: #fbbf24;
            width: 45px;
            height: 45px;
            border-radius: 16px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reader-title {
            flex: 1;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            color: #fbbf24;
        }

        .current-reciter {
            background: #2d3a4f;
            padding: 12px;
            border-radius: 16px;
            margin-top: 8px;
            font-size: 16px;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .current-reciter i {
            color: #fbbf24;
        }

        /* ===== المصحف ===== */
        .mushaf-container {
            background: #f8fafc;
            border-radius: 30px;
            padding: 20px 16px;
            color: #0f172a;
            line-height: 2.4;
            font-size: var(--font-size, 24px);
            margin: 16px 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .bismillah {
            font-size: 32px;
            color: #047857;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 700;
            border-bottom: 2px dashed #fbbf24;
            padding-bottom: 15px;
        }

        .ayah-text {
            display: inline;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 8px;
            transition: 0.2s;
        }

        .ayah-text:hover {
            background: #fbbf24;
            color: #0f172a;
        }

        .ayah-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #059669;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 12px;
            margin: 0 4px;
            border: 1px solid #fbbf24;
        }

        .tafseer-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #1e293b;
            color: #fbbf24;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-size: 11px;
            margin: 0 2px;
            cursor: pointer;
            border: 1px solid #fbbf24;
        }

        .active-ayah {
            background: linear-gradient(145deg, #059669, #047857);
            color: white !important;
            padding: 2px 12px;
            border-radius: 25px;
        }

        /* ===== مشغل الصوت الجديد ===== */
        .audio-player {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 500px;
            background: #1e293b;
            border: 2px solid #fbbf24;
            border-radius: 40px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 2100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .player-btn {
            background: #059669;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 0 #047857;
            transition: 0.1s;
        }

        .player-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #047857;
        }

        .player-btn:disabled {
            opacity: 0.3;
            transform: none;
            box-shadow: 0 4px 0 #047857;
        }

        .player-progress {
            flex: 1;
            height: 5px;
            background: #334155;
            border-radius: 5px;
            overflow: hidden;
            cursor: pointer;
        }

        .progress-fill {
            height: 100%;
            background: #fbbf24;
            width: 0%;
            transition: width 0.1s linear;
        }

        .player-time {
            color: #94a3b8;
            font-size: 14px;
            min-width: 70px;
            text-align: center;
        }

        /* ===== نافذة التفسير ===== */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: #1e293b;
            border-radius: 30px;
            padding: 24px;
            max-width: 500px;
            width: 100%;
            max-height: 70vh;
            overflow-y: auto;
            border: 2px solid #fbbf24;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #fbbf24;
        }

        .modal-header h3 {
            color: #fbbf24;
            font-size: 22px;
        }

        .modal-close {
            background: #334155;
            width: 40px;
            height: 40px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fbbf24;
            cursor: pointer;
        }

        .tafseer-text {
            color: #e2e8f0;
            font-size: 18px;
            line-height: 1.8;
        }

        /* ===== إشعارات ===== */
        .toast {
            position: fixed;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            background: #059669;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 16px;
            z-index: 4000;
            display: none;
            border: 1px solid #fbbf24;
        }

        /* ===== تحميل ===== */
        .loader {
            text-align: center;
            padding: 30px;
            color: #fbbf24;
        }

        .loader i {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            color: #ef4444;
            text-align: center;
            padding: 30px;
        }
    </style>
</head>
<body>
    <div class="app-container" id="appContainer">
        <!-- الهيدر -->
        <div class="app-header">
            <div class="header-top">
                <div class="app-logo">
                    <i class="fas fa-quran"></i>
                    <span>آيات</span>
                </div>
                <div class="quran-verse">
                    <p>وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا</p>
                    <small>سورة المزمل - ٤</small>
                </div>
            </div>
        </div>

        <!-- التبويبات -->
        <div id="surahsTab" style="display: block;">
            <div class="surah-grid" id="surahGrid"></div>
        </div>

        <div id="recitersTab" style="display: none;">
            <div class="reciters-search">
                <i class="fas fa-search"></i>
                <input type="text" id="reciterSearch" placeholder="ابحث عن قارئ...">
            </div>
            <div class="reciters-list" id="recitersList"></div>
        </div>

        <div id="juzTab" style="display: none;">
            <div class="juz-grid" id="juzGrid"></div>
        </div>

        <!-- التبويب السفلي -->
        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchMainTab('surahs')">
                <i class="fas fa-list"></i>
                <span>السور</span>
            </div>
            <div class="nav-item" onclick="switchMainTab('reciters')">
                <i class="fas fa-microphone"></i>
                <span>القراء</span>
            </div>
            <div class="nav-item" onclick="switchMainTab('juz')">
                <i class="fas fa-layer-group"></i>
                <span>الأجزاء</span>
            </div>
        </div>
    </div>

    <!-- صفحة القراءة -->
    <div class="reader-page" id="readerPage">
        <div class="reader-header">
            <div class="reader-nav">
                <button class="back-btn" onclick="closeReader()">
                    <i class="fas fa-arrow-right"></i>
                </button>
                <div class="reader-title" id="readerTitle">سورة الفاتحة</div>
                <button class="back-btn" onclick="shareSurah()">
                    <i class="fas fa-share-alt"></i>
                </button>
            </div>
            <div class="current-reciter" id="currentReciterDisplay">
                <i class="fas fa-microphone"></i>
                <span id="selectedReciterName">لم يتم اختيار قارئ</span>
            </div>
        </div>

        <div class="mushaf-container" id="mushafContent" style="--font-size: 24px">
            <div class="loader"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</div>
        </div>

        <!-- مشغل الصوت -->
        <div class="audio-player" id="audioPlayer">
            <button class="player-btn" onclick="prevAyah()" id="prevBtn">
                <i class="fas fa-step-backward"></i>
            </button>
            <button class="player-btn" onclick="togglePlay()" id="playPauseBtn">
                <i class="fas fa-play"></i>
            </button>
            <button class="player-btn" onclick="nextAyah()" id="nextBtn">
                <i class="fas fa-step-forward"></i>
            </button>
            <div class="player-progress" onclick="seekAudio(event)" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="player-time" id="timeDisplay">00:00 / 00:00</span>
        </div>
    </div>

    <!-- نافذة التفسير -->
    <div class="modal" id="tafseerModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-book-open"></i> تفسير الآية</h3>
                <div class="modal-close" onclick="closeTafseer()">
                    <i class="fas fa-times"></i>
                </div>
            </div>
            <div class="tafseer-text" id="tafseerText"></div>
        </div>
    </div>

    <!-- إشعار -->
    <div class="toast" id="toast"></div>

    <script>
        // ========== API ==========
        const API_QURAN = 'https://api.alquran.cloud/v1';
        const API_MP3 = 'https://mp3quran.net/api/v3';

        // ========== المتغيرات ==========
        let allSurahs = [];
        let allReciters = [];
        let currentSurah = null;
        let currentAyahs = [];
        let currentIndex = 0;
        let currentReciter = null;
        let isPlaying = false;
        let fontSize = 24;

        // عناصر DOM
        const surahGrid = document.getElementById('surahGrid');
        const recitersList = document.getElementById('recitersList');
        const juzGrid = document.getElementById('juzGrid');
        const readerPage = document.getElementById('readerPage');
        const mushafContent = document.getElementById('mushafContent');
        const readerTitle = document.getElementById('readerTitle');
        const selectedReciterName = document.getElementById('selectedReciterName');
        const audio = new Audio();
        const playPauseBtn = document.getElementById('playPauseBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressFill = document.getElementById('progressFill');
        const timeDisplay = document.getElementById('timeDisplay');
        const progressBar = document.getElementById('progressBar');
        const toast = document.getElementById('toast');

        // ========== تهيئة التطبيق ==========
        async function initApp() {
            await loadSurahs();
            await loadReciters();
            loadJuzList();
            
            // تحميل آخر قارئ مختار
            const savedReciter = localStorage.getItem('selectedReciter');
            if (savedReciter) {
                currentReciter = JSON.parse(savedReciter);
                updateReciterDisplay();
            }
        }

        // ========== تحميل السور ==========
        async function loadSurahs() {
            try {
                const res = await fetch(`${API_QURAN}/surah`);
                const data = await res.json();
                allSurahs = data.data;
                displaySurahs(allSurahs);
            } catch (e) {
                surahGrid.innerHTML = '<div class="error">فشل تحميل السور</div>';
            }
        }

        function displaySurahs(surahs) {
            surahGrid.innerHTML = '';
            surahs.forEach(s => {
                const div = document.createElement('div');
                div.className = 'surah-item';
                div.innerHTML = `
                    <div class="surah-number">${s.number}</div>
                    <div class="surah-info">
                        <div class="surah-name">${s.name}</div>
                        <div class="surah-details">
                            <span>${s.revelationType === 'Meccan' ? 'مكية' : 'مدنية'}</span>
                            <span>•</span>
                            <span>${s.numberOfAyahs} آيات</span>
                        </div>
                    </div>
                `;
                div.onclick = () => openSurah(s.number, s.name, s.revelationType);
                surahGrid.appendChild(div);
            });
        }

        // ========== تحميل القراء ==========
        async function loadReciters() {
            try {
                const res = await fetch(`${API_MP3}/reciters?language=ar`);
                const data = await res.json();
                allReciters = data.reciters;
                displayReciters(allReciters);
            } catch (e) {
                recitersList.innerHTML = '<div class="error">فشل تحميل القراء</div>';
            }
        }

        function displayReciters(reciters) {
            recitersList.innerHTML = '';
            reciters.forEach(r => {
                const div = document.createElement('div');
                div.className = `reciter-item ${currentReciter && currentReciter.id === r.id ? 'active' : ''}`;
                div.innerHTML = `
                    <div class="reciter-icon">${r.name.charAt(0)}</div>
                    <div class="reciter-info">
                        <div class="reciter-name">
                            ${r.name}
                            <small>${r.moshaf.length} رواية</small>
                        </div>
                    </div>
                `;
                div.onclick = () => selectReciter(r);
                recitersList.appendChild(div);
            });
        }

        // ========== البحث في القراء ==========
        document.getElementById('reciterSearch').addEventListener('input', (e) => {
            const search = e.target.value.toLowerCase();
            const filtered = allReciters.filter(r => 
                r.name.includes(search) || 
                r.name.toLowerCase().includes(search)
            );
            displayReciters(filtered);
        });

        // ========== اختيار قارئ ==========
        function selectReciter(reciter) {
            currentReciter = reciter;
            localStorage.setItem('selectedReciter', JSON.stringify(reciter));
            
            // تحديث الواجهة
            document.querySelectorAll('.reciter-item').forEach(item => {
                item.classList.remove('active');
            });
            event.currentTarget.classList.add('active');
            
            updateReciterDisplay();
            showToast(`تم اختيار ${reciter.name}`);
        }

        function updateReciterDisplay() {
            if (currentReciter) {
                selectedReciterName.textContent = currentReciter.name;
            } else {
                selectedReciterName.textContent = 'لم يتم اختيار قارئ';
            }
        }

        // ========== فتح السورة ==========
        async function openSurah(number, name, type) {
            readerPage.style.display = 'block';
            readerTitle.textContent = `سورة ${name}`;
            mushafContent.innerHTML = '<div class="loader"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</div>';
            
            try {
                const res = await fetch(`${API_QURAN}/surah/${number}/quran-uthmani`);
                const data = await res.json();
                currentSurah = number;
                currentAyahs = data.data.ayahs;
                currentIndex = 0;
                
                renderAyahs();
                updateButtons();
                resetAudio();
                
                // حفظ آخر قراءة
                localStorage.setItem('lastRead', JSON.stringify({
                    number, name, type
                }));
            } catch (e) {
                mushafContent.innerHTML = '<div class="error">فشل تحميل السورة</div>';
            }
        }

        function renderAyahs() {
            mushafContent.innerHTML = '';
            
            // البسملة
            if (currentSurah !== 9) {
                const bismillah = document.createElement('div');
                bismillah.className = 'bismillah';
                bismillah.textContent = 'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ';
                mushafContent.appendChild(bismillah);
            }
            
            // الآيات
            currentAyahs.forEach((a, i) => {
                const wrapper = document.createElement('span');
                wrapper.className = 'ayah-wrapper';
                
                const textSpan = document.createElement('span');
                textSpan.className = 'ayah-text';
                textSpan.id = `ayah-${i}`;
                textSpan.textContent = a.text;
                textSpan.onclick = () => playAyah(i);
                
                const numberSpan = document.createElement('span');
                numberSpan.className = 'ayah-number';
                numberSpan.textContent = a.numberInSurah;
                
                const tafseerSpan = document.createElement('span');
                tafseerSpan.className = 'tafseer-btn';
                tafseerSpan.innerHTML = '<i class="fas fa-book-open"></i>';
                tafseerSpan.onclick = (e) => {
                    e.stopPropagation();
                    showTafseer(a.number);
                };
                
                wrapper.appendChild(textSpan);
                wrapper.appendChild(numberSpan);
                wrapper.appendChild(tafseerSpan);
                mushafContent.appendChild(wrapper);
            });
        }

        // ========== تشغيل الآية ==========
        async function playAyah(index) {
            if (!currentReciter) {
                showToast('الرجاء اختيار قارئ أولاً');
                switchMainTab('reciters');
                return;
            }
            
            currentIndex = index;
            highlightAyah();
            
            try {
                const surahNumber = currentSurah.toString().padStart(3, '0');
                const moshaf = currentReciter.moshaf[0];
                const audioUrl = `${moshaf.server}${surahNumber}.mp3`;
                
                console.log('تحميل من:', audioUrl);
                
                // اختبار الاتصال قبل التشغيل
                const testRes = await fetch(audioUrl, { method: 'HEAD' });
                if (!testRes.ok) throw new Error('الملف غير متوفر');
                
                audio.src = audioUrl;
                audio.load();
                await audio.play();
                
                isPlaying = true;
                playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
                
                audio.onended = () => {
                    if (currentIndex < currentAyahs.length - 1) {
                        playAyah(currentIndex + 1);
                    } else {
                        resetPlayButton();
                    }
                };
                
            } catch (e) {
                console.error('خطأ في التشغيل:', e);
                showToast('تعذر تشغيل الصوت - جرب قارئ آخر');
                
                // محاولة تشغيل من سيرفر بديل
                if (currentReciter.moshaf.length > 1) {
                    currentReciter.moshaf.shift();
                    playAyah(index);
                }
            }
        }

        function highlightAyah() {
            document.querySelectorAll('.ayah-text').forEach(a => a.classList.remove('active-ayah'));
            const current = document.getElementById(`ayah-${currentIndex}`);
            if (current) {
                current.classList.add('active-ayah');
                current.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        // ========== التحكم في المشغل ==========
        function togglePlay() {
            if (!currentAyahs.length) return;
            
            if (audio.paused) {
                if (!audio.src) {
                    playAyah(currentIndex);
                } else {
                    audio.play();
                }
            } else {
                audio.pause();
                isPlaying = false;
                playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
            }
        }

        function prevAyah() {
            if (currentIndex > 0) {
                playAyah(currentIndex - 1);
            }
        }

        function nextAyah() {
            if (currentIndex < currentAyahs.length - 1) {
                playAyah(currentIndex + 1);
            }
        }

        function resetPlayButton() {
            isPlaying = false;
            playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
        }

        function updateButtons() {
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === currentAyahs.length - 1;
        }

        function resetAudio() {
            audio.pause();
            audio.src = '';
            resetPlayButton();
        }

        // ========== تحديث وقت الصوت ==========
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const progress = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = `${progress}%`;
                
                const current = formatTime(audio.currentTime);
                const total = formatTime(audio.duration);
                timeDisplay.textContent = `${current} / ${total}`;
            }
        });

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        window.seekAudio = function(e) {
            if (audio.duration) {
                const rect = progressBar.getBoundingClientRect();
                const pos = (e.clientX - rect.left) / rect.width;
                audio.currentTime = pos * audio.duration;
            }
        };

        // ========== التفسير ==========
        async function showTafseer(ayahNumber) {
            document.getElementById('tafseerModal').classList.add('show');
            document.getElementById('tafseerText').innerHTML = '<div class="loader"><i class="fas fa-spinner fa-spin"></i></div>';
            
            try {
                const res = await fetch(`${API_QURAN}/ayah/${ayahNumber}/ar.muyassar`);
                const data = await res.json();
                document.getElementById('tafseerText').innerHTML = data.data.text;
            } catch (e) {
                document.getElementById('tafseerText').innerHTML = 'فشل تحميل التفسير';
            }
        }

        function closeTafseer() {
            document.getElementById('tafseerModal').classList.remove('show');
        }

        // ========== الأجزاء ==========
        function loadJuzList() {
            juzGrid.innerHTML = '';
            for (let i = 1; i <= 30; i++) {
                const div = document.createElement('div');
                div.className = 'juz-card';
                div.innerHTML = `
                    <div class="juz-number">${i}</div>
                    <div class="juz-text">الجزء</div>
                `;
                div.onclick = () => openJuz(i);
                juzGrid.appendChild(div);
            }
        }

        async function openJuz(juzNumber) {
            showToast(`جاري تحميل الجزء ${juzNumber}`);
            // يمكن إضافة منطق عرض السور في الجزء
        }

        // ========== التنقل بين التبويبات ==========
        window.switchMainTab = function(tab) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            document.getElementById('surahsTab').style.display = 'none';
            document.getElementById('recitersTab').style.display = 'none';
            document.getElementById('juzTab').style.display = 'none';
            
            document.getElementById(`${tab}Tab`).style.display = 'block';
        };

        function closeReader() {
            readerPage.style.display = 'none';
            resetAudio();
        }

        function shareSurah() {
            const title = readerTitle.textContent;
            if (navigator.share) {
                navigator.share({
                    title: title,
                    text: `قراءة ${title} من القرآن الكريم`,
                });
            } else {
                showToast('تم نسخ الرابط');
            }
        }

        // ========== إشعارات ==========
        function showToast(message) {
            toast.textContent = message;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 2000);
        }

        // ========== البحث في السور ==========
        document.getElementById('reciterSearch').addEventListener('input', (e) => {
            // تم تنفيذه أعلاه
        });

        // ========== بدء التطبيق ==========
        initApp();

        // منع النقر المزدوج من تحديد النص
        document.addEventListener('mousedown', (e) => {
            if (e.target.classList.contains('player-btn')) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
